const slot = document.getElementById("slot");
const visual = cidade3DDFA3070DBE4841539B4DC45A73CB1FA2.default.create({ element: slot, host });
let largura = 1248;
function atualizar(filtro) {
  const linhas = LINHAS.map(l => filtro && l[1] === 0 ? [...l.slice(0, 3), l[3] + "*", ...l.slice(4)] : l);
  slot.style.width = largura + "px";
  visual.update({ type: 2 | 4, viewport: { width: largura, height: 648 }, dataViews: [{ metadata: { columns: COLS, objects: {} }, table: { columns: COLS, rows: linhas } }] });
}
document.getElementById("filtrar").onclick = () => atualizar(true);
document.getElementById("voltar").onclick = () => atualizar(false);
document.getElementById("estreito").onclick = () => { largura = largura === 1248 ? 480 : 1248; atualizar(false); };
