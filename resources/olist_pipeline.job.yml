# Sem cluster definido: as tasks rodam em compute serverless (único disponível na Free Edition)
resources:
  jobs:
    olist_pipeline:
      name: olist_pipeline
      parameters:
        - name: catalog
          default: ${var.catalog}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py

        - task_key: bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.py

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py

        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_star_schema.py

        - task_key: data_quality
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ../notebooks/04_data_quality.py

        - task_key: bi_views
          depends_on: [{ task_key: data_quality }]
          notebook_task:
            notebook_path: ../notebooks/05_bi_views.py
